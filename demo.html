<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MODA — Diseñador 3D</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0D0F16;
    --card:     #1C2030;
    --border:   #2A2E40;
    --gold:     #C8A96E;
    --gold-dim: #8A6E3E;
    --text:     #E8EAF0;
    --muted:    #8892A4;
    --active-bg:#252A3A;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ── Layout ─────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
  }

  /* ── Header ─────────────────────────────────────────────── */
  #header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 52px;
    background: #10121A;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  #header-left { display: flex; align-items: center; gap: 10px; }
  #logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--gold);
  }
  #tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-left: 1px solid var(--border);
    padding-left: 10px;
  }
  #header-right { display: flex; align-items: center; gap: 6px; }

  /* ── Toggles in header ───────────────────────────────────── */
  .toggle-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    padding: 4px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    transition: border-color .2s, color .2s;
  }
  .toggle-pill.on { border-color: var(--gold); color: var(--gold); }
  .toggle-pill input { display: none; }

  /* ── 3D Viewer ───────────────────────────────────────────── */
  #viewer-wrap {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
  }
  #viewer-iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #111318;
  }
  #viewer-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111318;
    pointer-events: none;
    transition: opacity .5s;
  }
  #viewer-overlay.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Export button (floating) ────────────────────────────── */
  #btn-export {
    position: absolute;
    bottom: 14px;
    right: 14px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--gold-dim);
    background: rgba(13,15,22,0.88);
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .15s, border-color .15s;
  }
  #btn-export:hover { background: rgba(200,169,110,0.12); border-color: var(--gold); }
  #btn-export:active { transform: scale(0.97); }

  /* ── Controls panel ─────────────────────────────────────── */
  #controls {
    flex: 0 0 auto;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    max-height: 42vh;
    min-height: 180px;
  }

  /* Tab bar */
  #tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  #tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1 0 auto;
    padding: 9px 10px;
    font-size: 11px;
    white-space: nowrap;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    user-select: none;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* Tab panels */
  #panels {
    flex: 1 1 0;
    overflow: hidden;
    position: relative;
  }
  .panel {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 10px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: none;
  }
  .panel.active { display: block; }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Cut grid */
  .cut-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .cut-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    font-size: 10px;
    text-align: center;
    transition: border-color .15s, color .15s, background .15s;
    user-select: none;
  }
  .cut-btn .cut-emoji { font-size: 18px; line-height: 1; }
  .cut-btn .cut-name  { font-size: 9px; }
  .cut-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--active-bg);
  }

  /* Fabric section */
  .section-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    margin-top: 4px;
  }
  .fabric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .fabric-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    font-size: 10px;
    text-align: center;
    transition: border-color .15s, color .15s, background .15s;
    user-select: none;
  }
  .fabric-btn .fab-emoji { font-size: 18px; line-height: 1; }
  .fabric-btn .fab-name  { font-size: 9px; }
  .fabric-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--active-bg);
  }

  /* Color swatches */
  .swatches-wrap {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    padding-bottom: 6px;
  }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .swatch:hover  { transform: scale(1.12); }
  .swatch.active { border-color: var(--gold); transform: scale(1.18); }

  /* ── Responsive: tablet+ horizontal expansion ─────────────── */
  @media (min-width: 640px) {
    .cut-grid, .fabric-grid { grid-template-columns: repeat(8, 1fr); }
    .swatch { width: 30px; height: 30px; }
  }

  /* ── Desktop: side panel layout ──────────────────────────── */
  @media (min-width: 1024px) {
    #app { flex-direction: row; flex-wrap: wrap; }
    #header { flex: 0 0 100%; order: -1; }
    #viewer-wrap {
      flex: 1 1 0;
      min-height: 0;
      height: calc(100vh - 52px);
      order: 1;
    }
    #controls {
      flex: 0 0 300px;
      max-height: calc(100vh - 52px);
      min-height: 0;
      border-top: none;
      border-left: 1px solid var(--border);
      order: 2;
    }
    .cut-grid, .fabric-grid { grid-template-columns: repeat(4, 1fr); }
    .swatch { width: 30px; height: 30px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <div id="header-left">
      <span id="logo">MODA</span>
      <span id="tagline">Diseñador 3D</span>
    </div>
    <div id="header-right">
      <label class="toggle-pill on" id="tgl-shirt">

  <div id="viewer-wrap">

      <div class="loader-ring"></div>

    <button id="btn-export">📸 Exportar PNG</button>

  <!-- Controls panel -->
  <section id="controls">
    <div id="tab-bar">

      <div class="panel" id="panel-pants-cut">

      <div class="panel" id="panel-shirt-fabric">

      <div class="panel" id="panel-pants-fabric">

        <div class="fabric-grid" id="grid-pants-fabric"></div>
        <div class="section-label">Color</div>
        <div class="swatches-wrap" id="swatches-pants"></div>
      </div>

    </div>
  </section>

</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const SHIRT_CUTS = [

  { id: 'vneck',      name: 'Cuello V',      emoji: '🔻' },

const FABRICS = [
  { id: 'cotton',    name: 'Algodón',    emoji: '🌿', colors: ['#FFFFFF','#F5F5DC','#000000','#1C3A5E','#8B0000','#2E7D32','#FF6B35','#9C27B0'] },
  { id: 'denim',     name: 'Denim',      emoji: '👖', colors: ['#1A237E','#37474F','#000051','#1B5E20','#4A148C','#BF360C','#33691E','#263238'] },
  { id: 'linen',     name: 'Lino',       emoji: '🌾', colors: ['#F5F5DC','#E8DCC8','#D4C5A9','#BCAAA4','#A1887F','#8D6E63','#795548','#5D4037'] },
  { id: 'silk',      name: 'Seda',       emoji: '✨', colors: ['#FFD700','#FF1744','#00BCD4','#E91E63','#9C27B0','#1DE9B6','#FF6F00','#F8F8FF'] },
  { id: 'polyester', name: 'Poliéster',  emoji: '🔬', colors: ['#F44336','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4','#FFEB3B','#FF5722'] },
  { id: 'velvet',    name: 'Terciopelo', emoji: '🎩', colors: ['#4A0E8F','#1B0000','#004D40','#B71C1C','#1A237E','#212121','#880E4F','#1B5E20'] },
  { id: 'leather',   name: 'Cuero',      emoji: '🥋', colors: ['#3E2723','#1A1A1A','#BF360C','#212121','#4E342E','#6D4C41','#D7CCC8','#8D6E63'] },
  { id: 'flannel',   name: 'Franela',    emoji: '🧸', colors: ['#B71C1C','#1A237E','#1B5E20','#4A148C','#E65100','#37474F','#880E4F','#33691E'] },
];

// ── App state ─────────────────────────────────────────────────────────────────
const state = {
  shirtCutId:    'tshirt',
  pantsCutId:    'straight',
  shirtFabricId: 'cotton',
  pantsFabricId: 'denim',
  shirtColor:    '#FFFFFF',
  pantsColor:    '#1A237E',
  showShirt:     true,
  showPants:     true,
  showMannequin: true,
};

// ── Viewer HTML (inlined Three.js scene, modified to postMessage to parent) ──
const VIEWER_HTML = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; touch-action: none; }

<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
<\/script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

// ─── Scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// ─── Environment map (studio room – makes ALL materials realistic) ─────────
RectAreaLightUniformsLib.init();
const pmremGen = new THREE.PMREMGenerator(renderer);
const envTex = pmremGen.fromScene(new RoomEnvironment(renderer), 0.02).texture;
scene.environment = envTex;
scene.background = new THREE.Color(0x0c0e14);
pmremGen.dispose();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 5.8);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Lighting (studio fashion setup) ─────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.08));

const key = new THREE.DirectionalLight(0xfff8f0, 4.2);
key.position.set(3.5, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1; key.shadow.camera.far = 30;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0006;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d8ff, 1.6);
fill.position.set(-5, 3, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffecd4, 1.2);
rim.position.set(1, 5, -6);
scene.add(rim);

const boxR = new THREE.RectAreaLight(0xfff5e4, 4, 3, 7);
boxR.position.set(4.5, 0.5, 3); boxR.lookAt(0, 0.5, 0);
scene.add(boxR);

const boxL = new THREE.RectAreaLight(0xe8eeff, 2, 2.5, 6);
boxL.position.set(-4.5, 0.5, 2); boxL.lookAt(0, 0.5, 0);
scene.add(boxL);

// ─── Floor ───────────────────────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.MeshStandardMaterial({ color: 0x14161e, roughness: 0.92, metalness: 0.08, envMapIntensity: 0.4 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.8;
floor.receiveShadow = true;
scene.add(floor);

// ─── Fabric Texture Generator (per-pixel realistic weave) ────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r, g, b};
}

function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }

function createFabricTexture(fabricId, color) {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const {r, g, b} = hexToRgb(color);

  for (let i = 0; i < size * size * 4; i += 4) {
    d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
  }

  switch (fabricId) {
    case 'cotton': {
      const T = 7;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const tx = Math.floor(x / T), ty = Math.floor(y / T);
        const px = (x % T) / T, py = (y % T) / T;
        const isWarp = (tx + ty) % 2 === 0;
        const tc = isWarp ? py : px;
        const hi = 0.78 + 0.22 * Math.sin(tc * Math.PI);
        const cross = Math.min(px, py, 1-px, 1-py) * 4;
        const sh = 0.82 + 0.18 * Math.pow(cross, 0.5);
        const v = 0.94 + 0.06 * (((tx*127+ty*311)&255)/255);
        const f = hi * sh * v;
        const i2 = (y*size+x)*4;
        d[i2]=clamp(r*f); d[i2+1]=clamp(g*f); d[i2+2]=clamp(b*f);
      }
      break;
    }
    case 'denim': {
      const T = 5;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const tx = Math.floor(x / T), ty = Math.floor(y / T);
        const px = (x % T) / T, py = (y % T) / T;
        const twill = (tx * 3 + ty) % 4;
        const isWeft = twill === 0;
        const tc = isWeft ? py : px;
        const hi = 0.7 + 0.3 * Math.sin(tc * Math.PI);
        const weftLight = isWeft ? 1.6 : 1.0;
        const v = 0.9 + 0.1 * (((tx*73+ty*127)&255)/255);
        const f = hi * v;
        const i2 = (y*size+x)*4;
        d[i2]=clamp(r*f*weftLight); d[i2+1]=clamp(g*f*weftLight); d[i2+2]=clamp(b*f*weftLight);
      }
      break;
    }
    case 'linen': {
      const T = 11;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const tx = Math.floor(x / T), ty = Math.floor(y / T);
        const px = (x % T) / T, py = (y % T) / T;
        const isWarp = (tx + ty) % 2 === 0;
        const tc = isWarp ? py : px;
        const slub = 0.85 + 0.15 * (((tx*37+ty*19)&15)/15);
        const hi = (0.68 + 0.32 * Math.sin(tc * Math.PI)) * slub;
        const i2 = (y*size+x)*4;
        d[i2]=clamp(r*hi); d[i2+1]=clamp(g*hi); d[i2+2]=clamp(b*hi);
      }
      break;
    }
    case 'silk': {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const i2 = (y*size+x)*4;
        const d1 = ((x*0.7 + y*0.3) % size) / size;
        const d2 = ((x*0.2 + y*0.8) % size) / size;
        const sheen = 0.55 + 0.35 * Math.pow(Math.sin(d1*Math.PI*1.5), 6)
                          + 0.1  * Math.pow(Math.sin(d2*Math.PI*2), 4);
        const hi = Math.pow(sheen, 0.7);
        d[i2]=clamp(r*hi + 40*(sheen-0.55)); d[i2+1]=clamp(g*hi + 40*(sheen-0.55)); d[i2+2]=clamp(b*hi + 40*(sheen-0.55));
      }
      break;
    }
    case 'polyester': {
      const T = 3;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const tx = Math.floor(x/T), ty = Math.floor(y/T);
        const px = (x%T)/T, py = (y%T)/T;
        const isWarp = (tx+ty)%2===0;
        const tc = isWarp ? py : px;
        const hi = 0.88 + 0.12 * Math.sin(tc*Math.PI);
        const sh = 1.0 + 0.04 * Math.sin((x+y)*0.25);
        const i2=(y*size+x)*4;
        d[i2]=clamp(r*hi*sh); d[i2+1]=clamp(g*hi*sh); d[i2+2]=clamp(b*hi*sh);
      }
      break;
    }
    case 'velvet': {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const i2=(y*size+x)*4;
        const pile = 0.88 + 0.12 * Math.sin((y/size)*Math.PI*3 + x*0.02);
        const noise = (((x*7+y*13+x*y*3)&0xff)/255)*0.08;
        const f = pile + noise - 0.04;
        d[i2]=clamp(r*f); d[i2+1]=clamp(g*f); d[i2+2]=clamp(b*f);
      }
      break;
    }
    case 'leather': {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const i2=(y*size+x)*4;
        const gx=x/28, gy=y/28;
        const cx=Math.floor(gx), cy=Math.floor(gy);
        let minD=99;
        for (let di=-1;di<=1;di++) for (let dj=-1;dj<=1;dj++) {
          const sd=((cx+di)*73+(cy+dj)*127)&0xffff;
          const px=(cx+di)+(sd&255)/255, py=(cy+dj)+((sd>>8)&255)/255;
          const dist=Math.sqrt((gx-px)**2+(gy-py)**2);
          minD=Math.min(minD,dist);
        }
        const grain=Math.pow(minD,0.35);
        const pore=((x*1049+y*1571)&0xffff)>0xf800?0.72:1.0;
        const sheen=1.0+0.08*Math.pow(Math.sin((x+y*0.5)/size*Math.PI),2);
        const f=(0.72+0.28*grain)*pore*sheen;
        d[i2]=clamp(r*f); d[i2+1]=clamp(g*f); d[i2+2]=clamp(b*f);
      }
      break;
    }
    case 'flannel': {
      const S1=48, S2=96;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const i2=(y*size+x)*4;
        const hb=(Math.floor(x/S1))%3===1?0.78:1.0;
        const vb=(Math.floor(y/S2))%3===1?0.82:1.0;
        const cross=(Math.floor(x/S1))%3===1&&(Math.floor(y/S2))%3===1?0.65:Math.min(hb,vb);
        const brush=0.92+0.08*(((x*3+y*7+x*y)&0xff)/255);
        const f=cross*brush;
        d[i2]=clamp(r*f); d[i2+1]=clamp(g*f); d[i2+2]=clamp(b*f);
      }
      break;
    }
  }

  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  tex.anisotropy = 8;
  return tex;
}

function createNormalMap(fabricId) {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i2 = (y*size+x)*4;
    let nx=128, ny=128;

    switch(fabricId) {
      case 'cotton': {
        const T=7;
        const px=(x%T)/T, py=(y%T)/T;
        const tx=Math.floor(x/T), ty=Math.floor(y/T);
        const isWarp=(tx+ty)%2===0;
        const tc=isWarp?py:px;
        const bump=Math.cos((tc-0.5)*Math.PI)*18;
        nx=clamp(128+(isWarp?0:bump)); ny=clamp(128+(isWarp?bump:0));
        break;
      }
      case 'denim': {
        const T=5;
        const tx=Math.floor(x/T), ty=Math.floor(y/T);
        const px=(x%T)/T, py=(y%T)/T;
        const twill=(tx*3+ty)%4; const isWeft=twill===0;
        const tc=isWeft?py:px;
        const bump=Math.cos((tc-0.5)*Math.PI)*22;
        const diag=Math.sin((x+y)*0.05)*8;
        nx=clamp(128+(isWeft?diag:bump)+diag*0.5);
        ny=clamp(128+(isWeft?bump:diag));
        break;
      }
      case 'linen': {
        const T=11; const px=(x%T)/T, py=(y%T)/T;
        const tx=Math.floor(x/T), ty=Math.floor(y/T);
        const isWarp=(tx+ty)%2===0; const tc=isWarp?py:px;
        const bump=Math.cos((tc-0.5)*Math.PI)*28;
        nx=clamp(128+(isWarp?0:bump)); ny=clamp(128+(isWarp?bump:0));
        break;
      }
      case 'silk': { nx=128; ny=128; break; }
      case 'polyester': {
        const px=(x%3)/3, py=(y%3)/3;
        nx=clamp(128+Math.cos((px-0.5)*Math.PI)*8);
        ny=clamp(128+Math.cos((py-0.5)*Math.PI)*8);
        break;
      }
      case 'velvet': {
        const seed=(x*7+y*11)&0xff;
        nx=clamp(128+(seed/255-0.5)*24);
        ny=clamp(128+Math.sin(y*0.3)*10);
        break;
      }
      case 'leather': {
        const gx=x/28, gy=y/28;
        const cx=Math.floor(gx), cy=Math.floor(gy);
        const smooth=(gx-cx)*(1-(gx-cx))*4;
        const smoothY=(gy-cy)*(1-(gy-cy))*4;
        nx=clamp(128+Math.sin(gx*Math.PI*2)*smooth*20);
        ny=clamp(128+Math.sin(gy*Math.PI*2)*smoothY*20);
        break;
      }
      case 'flannel': {
        const T=7; const px=(x%T)/T, py=(y%T)/T;
        const bump=Math.cos((px-0.5)*Math.PI)*10+Math.cos((py-0.5)*Math.PI)*10;
        nx=clamp(128+bump); ny=clamp(128+bump);
        break;
      }
      default: { nx=128; ny=128; }
    }
    d[i2]=nx; d[i2+1]=ny; d[i2+2]=255; d[i2+3]=255;
  }

  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  return tex;
}

// ─── Material factory (PBR + MeshPhysicalMaterial for velvet/silk/leather) ───
function makeMaterial(fabricId, color, roughness, metalness) {
  const base = {
    color: new THREE.Color(color),
    roughness, metalness,
    map: createFabricTexture(fabricId, color),
    normalMap: createNormalMap(fabricId),
    normalScale: new THREE.Vector2(
      fabricId==='silk' ? 0.05 :
      fabricId==='linen' ? 0.7 :
      fabricId==='leather' ? 0.55 :
      fabricId==='velvet' ? 0.35 : 0.45,
      fabricId==='silk' ? 0.05 :
      fabricId==='linen' ? 0.7 :
      fabricId==='leather' ? 0.55 :
      fabricId==='velvet' ? 0.35 : 0.45,
    ),
    envMapIntensity: fabricId==='silk'?1.4 : fabricId==='leather'?1.1 : fabricId==='polyester'?0.7 : 0.5,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  };

  if (fabricId === 'velvet') {
    return new THREE.MeshPhysicalMaterial({
      ...base,
      sheen: 1.0,
      sheenColor: new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.4),
      sheenRoughness: 0.5,
    });
  }
  if (fabricId === 'silk') {
    return new THREE.MeshPhysicalMaterial({
      ...base,
      sheen: 0.6,
      sheenColor: new THREE.Color(0xffffff),
      sheenRoughness: 0.15,
    });
  }
  if (fabricId === 'leather') {
    return new THREE.MeshPhysicalMaterial({
      ...base,
      clearcoat: 0.4,
      clearcoatRoughness: 0.25,
    });
  }

  return new THREE.MeshStandardMaterial(base);
}

function buildPantsShape(cutId) {

  const cuts = {
    skinny:   {top:0.35,bot:0.18,hem:-1.15,gap:0.08},
    straight: {top:0.38,bot:0.38,hem:-1.15,gap:0.08},
    widel:    {top:0.42,bot:0.64,hem:-1.15,gap:0.1 },
    bootcut:  {top:0.36,bot:0.5, hem:-1.15,gap:0.08},
    cargo:    {top:0.4, bot:0.4, hem:-1.15,gap:0.1 },
    dress:    {top:0.36,bot:0.32,hem:-1.15,gap:0.07},
    jogger:   {top:0.44,bot:0.22,hem:-1.12,gap:0.1 },
    shorts:   {top:0.4, bot:0.44,hem:-0.22,gap:0.1 },

  const p = cuts[cutId] || cuts.straight;
  const ww = 0.72;
  shape.moveTo(-ww,1.08); shape.lineTo(ww,1.08);
  shape.lineTo(ww,0.82); shape.quadraticCurveTo(ww+0.06,0.55,p.top+p.gap,0.48);
  shape.lineTo(p.bot+p.gap,p.hem);
  shape.lineTo(p.gap*0.3,p.hem); shape.quadraticCurveTo(0,-0.4,-p.gap*0.3,p.hem);
  shape.lineTo(-p.bot-p.gap,p.hem); shape.lineTo(-p.top-p.gap,0.48);
  shape.quadraticCurveTo(-ww-0.06,0.55,-ww,0.82); shape.lineTo(-ww,1.08);
  const wb=new THREE.Path();
  wb.moveTo(-(ww-0.04),1.04); wb.lineTo(ww-0.04,1.04); wb.lineTo(ww-0.04,0.86); wb.lineTo(-(ww-0.04),0.86); wb.lineTo(-(ww-0.04),1.04);
  shape.holes.push(wb);
  if (cutId==='cargo') {
    const lp=new THREE.Path(); lp.moveTo(-(p.top+p.gap+0.08),0.1); lp.lineTo(-(p.top+p.gap+0.08),-0.32); lp.lineTo(-(p.gap+0.04),-0.32); lp.lineTo(-(p.gap+0.04),0.1); lp.lineTo(-(p.top+p.gap+0.08),0.1); shape.holes.push(lp);
    const rp=new THREE.Path(); rp.moveTo(p.top+p.gap+0.08,0.1); rp.lineTo(p.top+p.gap+0.08,-0.32); rp.lineTo(p.gap+0.04,-0.32); rp.lineTo(p.gap+0.04,0.1); rp.lineTo(p.top+p.gap+0.08,0.1); shape.holes.push(rp);
  }
  return new THREE.ExtrudeGeometry(shape, bevel);
}

let state = {
  shirtCutId: 'tshirt',
  pantsCutId: 'straight',
  shirtFabricId: 'cotton',
  pantsFabricId: 'denim',
  shirtColor: '#FFFFFF',
  pantsColor: '#1A237E',
  showShirt: true,
  showPants: true,
  showMannequin: true,
};

let shirtMesh = null;
let pantsMesh = null;
const shirtGroup = new THREE.Group();
const pantsGroup = new THREE.Group();
shirtGroup.position.y = 1.1;
pantsGroup.position.y = -1.25;
scene.add(shirtGroup);
scene.add(pantsGroup);

function buildShirt() {
  if (shirtMesh) { shirtGroup.remove(shirtMesh); shirtMesh.geometry.dispose(); shirtMesh.material.dispose(); }
  const geo = buildShirtShape(state.shirtCutId);
  geo.center();
  const fp = FABRIC_PROPS[state.shirtFabricId] || FABRIC_PROPS.cotton;
  const mat = makeMaterial(state.shirtFabricId, state.shirtColor, fp.roughness, fp.metalness);
  shirtMesh = new THREE.Mesh(geo, mat);
  shirtMesh.castShadow = true;
  shirtMesh.receiveShadow = true;
  shirtGroup.add(shirtMesh);
  shirtGroup.visible = state.showShirt;
}

function buildPants() {
  if (pantsMesh) { pantsGroup.remove(pantsMesh); pantsMesh.geometry.dispose(); pantsMesh.material.dispose(); }
  const geo = buildPantsShape(state.pantsCutId);
  geo.center();
  const fp = FABRIC_PROPS[state.pantsFabricId] || FABRIC_PROPS.denim;
  const mat = makeMaterial(state.pantsFabricId, state.pantsColor, fp.roughness, fp.metalness);
  pantsMesh = new THREE.Mesh(geo, mat);
  pantsMesh.castShadow = true;
  pantsMesh.receiveShadow = true;
  pantsGroup.add(pantsMesh);
  pantsGroup.visible = state.showPants;
}

buildShirt();
buildPants();

// ─── Touch Controls ───────────────────────────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let pinchDist = 0;
let rotX = 0.08, rotY = 0;
let zoom = 5.5;
const targetGroup = new THREE.Group();
scene.add(targetGroup);
const mannequin = createMannequin();
targetGroup.add(mannequin);
targetGroup.add(shirtGroup);
targetGroup.add(pantsGroup);

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('pointerup', () => { isDragging = false; });
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  rotY += dx * 0.008;
  rotX += dy * 0.005;
  rotX = Math.max(-0.5, Math.min(0.5, rotX));
  lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('touchstart', e => { if (e.touches.length===2) { pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); } }, {passive:true});
canvas.addEventListener('touchmove', e => {
  if (e.touches.length===2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    zoom += (pinchDist - d) * 0.02;
    zoom = Math.max(3, Math.min(10, zoom));
    pinchDist = d;
  }
}, {passive:true});

canvas.addEventListener('wheel', e => {
  zoom += e.deltaY * 0.01;
  zoom = Math.max(3, Math.min(10, zoom));
});

// ─── Message Handling ─────────────────────────────────────────────────────────
function applyState(msg) {
  let needShirt = false, needPants = false;
  if (msg.shirtCutId !== undefined && msg.shirtCutId !== state.shirtCutId) { state.shirtCutId = msg.shirtCutId; needShirt = true; }
  if (msg.pantsCutId !== undefined && msg.pantsCutId !== state.pantsCutId) { state.pantsCutId = msg.pantsCutId; needPants = true; }
  if (msg.shirtFabricId !== undefined && msg.shirtFabricId !== state.shirtFabricId) { state.shirtFabricId = msg.shirtFabricId; needShirt = true; }
  if (msg.pantsFabricId !== undefined && msg.pantsFabricId !== state.pantsFabricId) { state.pantsFabricId = msg.pantsFabricId; needPants = true; }
  if (msg.shirtColor !== undefined && msg.shirtColor !== state.shirtColor) { state.shirtColor = msg.shirtColor; needShirt = true; }
  if (msg.pantsColor !== undefined && msg.pantsColor !== state.pantsColor) { state.pantsColor = msg.pantsColor; needPants = true; }
  if (msg.showShirt !== undefined) { state.showShirt = msg.showShirt; if (shirtGroup) shirtGroup.visible = msg.showShirt; }
  if (msg.showPants !== undefined) { state.showPants = msg.showPants; if (pantsGroup) pantsGroup.visible = msg.showPants; }
  if (msg.showMannequin !== undefined) { state.showMannequin = msg.showMannequin; mannequin.visible = msg.showMannequin; }
  if (needShirt) buildShirt();
  if (needPants) buildPants();
}

window.addEventListener('message', e => {
  try {
    const msg = JSON.parse(e.data);
    if (msg.type === 'update') applyState(msg);
    if (msg.type === 'capture') {
      renderer.render(scene, camera);
      window.parent.postMessage(JSON.stringify({ type: 'capture', data: renderer.domElement.toDataURL('image/png') }), '*');
    }
    if (msg.type === 'reset') { rotX = 0.08; rotY = 0; zoom = 5.5; }
  } catch(_){}
});

window.parent.postMessage(JSON.stringify({ type: 'ready' }), '*');

// ─── Render Loop ──────────────────────────────────────────────────────────────
let autoRotate = true;
let autoT = 0;
canvas.addEventListener('pointerdown', () => { autoRotate = false; });

function animate() {
  requestAnimationFrame(animate);
  if (autoRotate) { autoT += 0.004; rotY = Math.sin(autoT) * 0.4; }
  targetGroup.rotation.y += (rotY - targetGroup.rotation.y) * 0.08;
  targetGroup.rotation.x += (rotX - targetGroup.rotation.x) * 0.08;
  camera.position.z += (zoom - camera.position.z) * 0.06;
  renderer.render(scene, camera);
}
animate();
<\/script>
</body>
</html>`;

// ── Iframe bootstrap ──────────────────────────────────────────────────────────
const iframe = document.getElementById('viewer-iframe');
const overlay = document.getElementById('viewer-overlay');
let viewerReady = false;

(function loadViewer() {
  const blob = new Blob([VIEWER_HTML], { type: 'text/html' });
  iframe.src = URL.createObjectURL(blob);
})();

window.addEventListener('message', e => {
  try {
    const msg = JSON.parse(e.data);
    if (msg.type === 'ready') {
      viewerReady = true;
      overlay.classList.add('hidden');
      // Push initial state so viewer matches UI defaults
      sendUpdate(state);
    }
    if (msg.type === 'capture' && msg.data) {
      const a = document.createElement('a');
      a.href = msg.data;
      a.download = 'moda-' + Date.now() + '.png';
      a.click();
    }
  } catch(_) {}
});

function sendUpdate(patch) {
  if (!viewerReady) return;
  iframe.contentWindow.postMessage(JSON.stringify({ type: 'update', ...patch }), '*');
}

// ── Tab switching ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ── Build cut grids ───────────────────────────────────────────────────────────
function buildCutGrid(containerId, cuts, stateKey, msgKey) {
  const grid = document.getElementById(containerId);
  cuts.forEach(cut => {
    const btn = document.createElement('div');
    btn.className = 'cut-btn' + (state[stateKey] === cut.id ? ' active' : '');
    btn.innerHTML = `<span class="cut-emoji">${cut.emoji}</span><span class="cut-name">${cut.name}</span>`;
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.cut-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKey] = cut.id;
      sendUpdate({ [msgKey]: cut.id });
    });
    grid.appendChild(btn);
  });
}

buildCutGrid('grid-shirt-cut', SHIRT_CUTS, 'shirtCutId', 'shirtCutId');
buildCutGrid('grid-pants-cut', PANTS_CUTS, 'pantsCutId', 'pantsCutId');

// ── Build fabric grids + swatches ─────────────────────────────────────────────
function buildFabricSection(gridId, swatchId, stateKeyFabric, stateKeyColor) {
  const grid = document.getElementById(gridId);
  const swatchWrap = document.getElementById(swatchId);

  function renderSwatches(fabric, selectedColor) {
    swatchWrap.innerHTML = '';
    fabric.colors.forEach(hex => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (selectedColor === hex ? ' active' : '');
      sw.style.background = hex;
      sw.title = hex;
      sw.addEventListener('click', () => {
        swatchWrap.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        state[stateKeyColor] = hex;
        sendUpdate({ [stateKeyColor]: hex });
      });
      swatchWrap.appendChild(sw);
    });
  }

  FABRICS.forEach(fab => {
    const btn = document.createElement('div');
    btn.className = 'fabric-btn' + (state[stateKeyFabric] === fab.id ? ' active' : '');
    btn.innerHTML = `<span class="fab-emoji">${fab.emoji}</span><span class="fab-name">${fab.name}</span>`;
    btn.addEventListener('click', () => {
      grid.querySelectorAll('.fabric-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKeyFabric] = fab.id;
      // Use first color if current color not in new fabric's palette
      const col = fab.colors.includes(state[stateKeyColor]) ? state[stateKeyColor] : fab.colors[0];
      state[stateKeyColor] = col;
      sendUpdate({ [stateKeyFabric]: fab.id, [stateKeyColor]: col });
      renderSwatches(fab, col);
    });
    grid.appendChild(btn);
  });

  const initFab = FABRICS.find(f => f.id === state[stateKeyFabric]) || FABRICS[0];
  renderSwatches(initFab, state[stateKeyColor]);
}

buildFabricSection('grid-shirt-fabric', 'swatches-shirt', 'shirtFabricId', 'shirtColor');
buildFabricSection('grid-pants-fabric', 'swatches-pants', 'pantsFabricId', 'pantsColor');

// ── Toggles ───────────────────────────────────────────────────────────────────
function setupToggle(labelId, stateKey) {
  const label = document.getElementById(labelId);
  const cb = label.querySelector('input');
  cb.addEventListener('change', () => {
    state[stateKey] = cb.checked;
    label.classList.toggle('on', cb.checked);
    sendUpdate({ [stateKey]: cb.checked });
  });
}

setupToggle('tgl-shirt',     'showShirt');
setupToggle('tgl-pants',     'showPants');
setupToggle('tgl-mannequin', 'showMannequin');

// ── Export PNG ────────────────────────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  if (!viewerReady) return;
  iframe.contentWindow.postMessage(JSON.stringify({ type: 'capture' }), '*');
});
</script>
